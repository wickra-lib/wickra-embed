name: Release

# Runs on a pushed `v*` tag and performs the irreversible crates.io publish of
# wickra-embed-core plus the GitHub Release. There are no PyPI / npm / NuGet /
# Maven / Go / r-universe steps: this product is C-ABI-only, so the language
# bindings the other Wickra crates publish do not exist here. The C ABI ships as
# prebuilt no-alloc staticlibs for the two bare-metal triples and the host,
# attached as release assets rather than published to a registry, and attested.
#
# The shape is the family's: `guard` refuses anything but a tag, every artefact
# is built first, `gate` requires the tagged commit's CI to be green, and only
# then does anything leave the runner. workflow_dispatch exists so a run can be
# repeated for a tag whose publish step failed; the guard keeps it from ever
# publishing a branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io inside any build or publish step retries
  # automatically instead of failing the job.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  guard:
    name: Refuse to publish from anything but a tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the ref
        env:
          REF: ${{ github.ref }}
        shell: bash
        run: |
          case "$REF" in
            refs/tags/v*)
              echo "publishing from $REF"
              ;;
            *)
              echo "::error::release.yml publishes to crates.io, which cannot be undone. It runs on a v* tag; got '$REF'. Re-run this workflow with a tag ref."
              exit 1
              ;;
          esac

  # The tag must name the version the manifests declare: a v0.2.0 tag on a
  # 0.1.0 tree would publish 0.1.0 under a release called v0.2.0.
  version:
    name: The tag names the declared version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with Cargo.toml
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          declared=$(sed -n 's/^version = "\([0-9][^"]*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v${declared}" != "${REF_NAME}" ]; then
            echo "::error::tag ${REF_NAME} does not match the workspace version ${declared}"
            exit 1
          fi
          echo "tag ${REF_NAME} matches the workspace version"

  staticlibs:
    name: C ABI staticlib (${{ matrix.target }})
    needs: [guard, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a wedged job, not a budget
    strategy:
      fail-fast: false
      matrix:
        include:
          # The bare-metal archives carry no std: the firmware supplies
          # `wickra_embed_panic` (see the C ABI docs). The host archive keeps
          # the default `std` feature and Rust's own panic handler.
          - { target: thumbv7em-none-eabihf, features: --no-default-features }
          - { target: thumbv6m-none-eabi, features: --no-default-features }
          - { target: x86_64-unknown-linux-gnu, features: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The bare-metal targets cannot build a cdylib (no dynamic linker), so ask
      # rustc for the staticlib crate-type only. That yields a uniform
      # `libwickra_embed.a` for every triple, which firmware links directly.
      - name: Build the no-alloc C ABI staticlib
        env:
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          # FEATURES is one flag or empty; an empty quoted argument would
          # reach cargo, so the flag is passed only when it is set.
          if [ -n "$FEATURES" ]; then set -- "$FEATURES"; else set --; fi
          cargo rustc -p wickra-embed-c --release "$@" --target "$TARGET" --crate-type staticlib
      - name: Package the staticlib, the headers and the licence texts
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist stage
          cp "target/${TARGET}/release/libwickra_embed.a" stage/
          cp bindings/c/include/wickra_embed.h bindings/c/include/wickra_embed.hpp stage/
          cp LICENSE-MIT LICENSE-APACHE stage/
          tar -C stage -czf "dist/wickra-embed-c-${REF_NAME}-${TARGET}.tar.gz" .
      - name: Upload staticlib artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staticlib-${{ matrix.target }}
          path: dist/*.tar.gz

  # Nothing publishes before this. Every artefact above has built, and the
  # tagged commit's own CI run -- and every other workflow that ran on it --
  # is green. A red CI on the tag means the tag was cut from a broken tree;
  # publishing it would ship the break.
  gate:
    name: Nothing publishes before this
    needs: [guard, version, staticlibs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: The tagged commit must have passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            ci_state=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
                 -q '(.workflow_runs[0] // {}) | "\(.status // "missing") \(.conclusion // "null")"')
            ci_status=${ci_state%% *}
            ci=${ci_state##* }
            if [ "$ci" = "success" ]; then
              break
            fi
            if [ "$ci" != "null" ]; then
              echo "::error::ci.yml on ${SHA} is ${ci}; refusing to publish"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::ci.yml on ${SHA} did not finish within 45 minutes (${ci_status}); refusing to publish"
              exit 1
            fi
            echo "ci.yml on ${SHA}: ${ci_status} -- waiting"
            sleep 30
          done
          echo "ci.yml on ${SHA}: success"
          # Newest run per workflow name: a rerun that went green supersedes
          # the failed attempt it replaced.
          bad=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
                  -q '[.workflow_runs[] | select(.name != "Release")]
                      | group_by(.name) | map(max_by(.id))
                      | map(select(.conclusion == "failure" or .conclusion == "timed_out"
                                   or .conclusion == "cancelled"))
                      | map(.name) | unique | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::the tagged commit has failing runs (${bad}); refusing to publish"
            exit 1
          fi
          echo "every workflow that ran on this commit is green"

  cargo-publish:
    name: Publish wickra-embed-core to crates.io
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [gate, guard]
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Only the no_std core is a library crate for downstream Rust firmware. The
      # C ABI crate (wickra-embed-c) is a staticlib artefact, not a registry
      # dependency, so it ships as a release asset instead.
      #
      # Idempotent: a re-run of a release whose later steps failed must not
      # fail here on "already uploaded".
      - name: Publish wickra-embed-core (idempotent)
        run: |
          if out=$(cargo publish -p wickra-embed-core --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
            echo "$out"
          elif printf '%s' "$out" | grep -q "already uploaded\|already exists"; then
            echo "skip: already published"
          else
            echo "$out"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Build the .crate file for release attachment
        run: cargo package -p wickra-embed-core
      - name: Upload the .crate file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-files
          path: target/package/*.crate
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-cyclonedx
      - name: Generate the CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --top-level
          mkdir -p sboms
          cp crates/embed-core/wickra-embed-core.cdx.json sboms/
          ls -lh sboms/
      - name: Upload the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/*.cdx.json

  github-release:
    name: Attach assets to the draft GitHub Release
    timeout-minutes: 45
    needs: [cargo-publish, staticlibs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve target tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::no v* tag found to attach assets to"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "::notice::attaching assets to release $tag"
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Stage release assets
        run: |
          set -e
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.crate" -exec cp {} release-assets/ \;
          find artifacts -type f -name "*.cdx.json" -exec cp {} release-assets/ \;
          ls -lh release-assets/
          echo "asset-count=$(find release-assets/ -type f | wc -l)"
      # Draft first so a partial asset upload never surfaces a half-baked
      # release; publish-release flips it live once provenance is attached.
      - name: Create / update the draft GitHub Release with assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: wickra-embed ${{ steps.tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: true
          body: |
            wickra-embed ${{ github.ref_name }} — allocation-free, `#![no_std]` streaming indicators for bare-metal and HFT, byte-for-byte identical to wickra-core.
            ```toml
            [dependencies]
            wickra-embed-core = { version = "${{ steps.tag.outputs.version }}", default-features = false }
            ```
            The C ABI ships as a no-alloc staticlib per target, with `wickra_embed.h`,
            the C++ wrapper and the licence texts inside each archive:
            `thumbv7em-none-eabihf`, `thumbv6m-none-eabi`, `x86_64-unknown-linux-gnu`.
            The same `.crate` file this run published to crates.io and its CycloneDX
            SBOM are attached; the provenance bundle covers every asset.

  attestations:
    name: Attest build provenance
    timeout-minutes: 45
    needs: [cargo-publish, staticlibs, github-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download the crate file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-files
          path: artifacts/crates
      - name: Download the C ABI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: staticlib-*
          path: artifacts/c-abi
          merge-multiple: true
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/c-abi/*.tar.gz
            artifacts/crates/*.crate
      - name: Attach provenance bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot attach provenance."
            exit 1
          fi
          if [ -z "$BUNDLE" ] || [ ! -f "$BUNDLE" ]; then
            echo "::error::attestation bundle not found at '$BUNDLE'."
            exit 1
          fi
          dest="wickra-embed-${TAG}.provenance.intoto.jsonl"
          cp "$BUNDLE" "$dest"
          echo "Uploading $dest to release $TAG"
          gh release upload "$TAG" "$dest" --clobber --repo "$REPO"

  publish-release:
    name: Publish the GitHub Release
    timeout-minutes: 45
    needs: [github-release, attestations]
    if: always() && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Flip the draft release to published (latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.github-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from github-release; cannot publish."
            exit 1
          fi
          echo "::notice::publishing release $TAG (draft -> published, latest)"
          gh release edit "$TAG" --draft=false --latest --repo "$REPO"
