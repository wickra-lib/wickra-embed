name: CodSpeed

# Performance regressions were the one class of defect nothing here reported.
# bench.yml runs on a schedule and prints numbers a person has to read, so a
# regression surfaces weeks after it lands, if at all. This measures every pull
# request and says so in a comment.
#
# It counts instructions under instrumentation rather than timing wall clock.
# That is what makes a shared runner usable: the number does not move because a
# neighbouring VM got busy. It is also why these figures are not the ones in
# embed-benchMARKS.md -- those are throughput, this is relative change. Both are true;
# they answer different questions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Instruction counts
    runs-on: ubuntu-latest
    timeout-minutes: 45 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-codspeed
      - name: Build the benchmarks
        run: cargo codspeed build -p embed-bench
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          # Required since action v4, where it used to be inferred. `simulation`
          # counts instructions under instrumentation; `walltime` measures real
          # time and needs CodSpeed's dedicated runners -- on a standard GitHub
          # runner the timing would carry exactly the noise this job exists to
          # avoid.
          mode: simulation
          run: cargo codspeed run
          token: ${{ secrets.CODSPEED_TOKEN }}
