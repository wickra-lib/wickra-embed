name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Network-flake resilience: retry transient registry/DNS failures at the tool
  # level so a blip fetching crates.io inside a build retries automatically
  # instead of failing the job.
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PIP_RETRIES: "5"
  PIP_DEFAULT_TIMEOUT: "120"
  # No npm here today; the family sets these everywhere so a job that grows a
  # Node step inherits the same resilience.
  npm_config_fetch_retries: "5"
  npm_config_fetch_retry_maxtimeout: "120000"
  RUSTFLAGS: "-D warnings"

# wickra-embed-core is `#![no_std]` and allocation-free. The host jobs (fmt, clippy,
# test) run with the default `std` feature; the `build-no_std` matrix cross-
# compiles the core with `--no-default-features` to the bare-metal targets. The
# `alloc-leak-guard` job goes one step further and greps the emitted object for
# allocator symbols, so a `Vec`/`Box` slipping into the core fails CI even though
# the crate would still compile. `coverage` measures the determinism core,
# `fuzz-smoke` exercises the host fuzz targets, `c-abi` builds the no-alloc C ABI
# and checks header drift, and `example-embedded` cross-builds the Cortex-M demo.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (host + no_std)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy the host workspace (std)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy the no_std core on a bare-metal target
        run: cargo clippy -p wickra-embed-core --no-default-features --target thumbv7em-none-eabihf -- -D warnings

  build-no_std:
    name: Build no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, thumbv6m-none-eabi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # No `--all-targets`: tests and doctests need std. A pure lib build of the
      # no-alloc core is the allocation-leak guard — it fails if `std`/`alloc` is
      # pulled in.
      - run: cargo build -p wickra-embed-core --no-default-features --target ${{ matrix.target }}
      # The archive the release ships for this target: the C ABI without std,
      # its panic handler forwarding to the firmware's `wickra_embed_panic`.
      # A staticlib demands a panic handler, so this is the build that proves
      # the crate links for firmware.
      - name: Build the no_std C ABI staticlib
        run: cargo rustc -p wickra-embed-c --no-default-features --target ${{ matrix.target }} --crate-type staticlib

  alloc-leak-guard:
    name: No-alloc guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: thumbv6m-none-eabi
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # A pure lib build succeeds even if the core `extern crate alloc`s, because
      # `alloc` is available for the target (only *linking a binary* without an
      # allocator would fail). So build the rlib and assert its objects reference
      # none of the runtime allocator shims — that catches a `Vec`/`Box` the
      # moment it lands, on the hardest (soft-float, FPU-less) target.
      - name: Build the no-alloc core (release)
        run: cargo build -p wickra-embed-core --no-default-features --release --target thumbv6m-none-eabi
      - name: Assert no allocator symbols are referenced
        shell: bash
        run: |
          # llvm-tools-preview ships llvm-nm; ensure it is present regardless of
          # whether the setup action installed it, then locate it (it is a
          # symlink under the sysroot, so do not filter on -type f).
          rustup component add llvm-tools-preview
          rlib=$(find target/thumbv6m-none-eabi/release -name 'libwickra_embed_core-*.rlib' | head -n1)
          test -n "$rlib" || { echo "wickra-embed-core rlib not found"; exit 1; }
          nm=$(find "$(rustc --print sysroot)" -name 'llvm-nm' | head -n1)
          test -n "$nm" || { echo "llvm-nm not found"; exit 1; }
          echo "Scanning $rlib"
          if "$nm" "$rlib" 2>/dev/null | grep -E '__rust_(alloc|realloc|dealloc|alloc_zeroed)'; then
            echo "FAIL: allocator symbols present — wickra-embed-core pulled in alloc"
            exit 1
          fi
          echo "OK: no allocator symbols in the no-alloc core"

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.86"
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check the host workspace
        run: cargo check --workspace --all-features
      - name: Check the no_std core on a bare-metal target
        run: cargo check -p wickra-embed-core --no-default-features --target thumbv7em-none-eabihf

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources licenses

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-llvm-cov
      # The moat lives in wickra-embed-core: the no-alloc arithmetic that must stay
      # byte-identical to std wickra-core. Measure it in isolation so patch
      # coverage tracks the core.
      - name: Generate coverage (lcov)
        run: cargo llvm-cov -p wickra-embed-core --all-features --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # An organization-level upload token carries no repository identity,
          # so Codecov cannot route the upload without an explicit slug and
          # falls back to a tokenless upload, which a protected branch rejects.
          slug: ${{ github.repository }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # cargo-fuzz injects its own sanitizer RUSTFLAGS; the repo-wide `-D warnings`
    # would ride along into that instrumented build, so clear it for this job.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-fuzz
      - name: Fuzz sma_update (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu sma_update -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz ema_update (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ema_update -- -max_total_time=30
        working-directory: fuzz
      - name: Fuzz ohlc_update (30 s)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ohlc_update -- -max_total_time=30
        working-directory: fuzz

  c-abi:
    name: C ABI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cbindgen
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cbindgen
      - name: Build the C ABI library (cdylib + staticlib)
        run: cargo build -p wickra-embed-c --release
      - name: Rust unit tests
        run: cargo test -p wickra-embed-c
      # The generated header is platform-independent, so checking drift on one OS
      # is enough — and avoids a spurious CRLF/LF diff on the Windows runner.
      - name: Check the generated C header is in sync
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd bindings/c
          cbindgen --config cbindgen.toml --crate wickra-embed-c --output /tmp/wickra_embed.h
          diff -u include/wickra_embed.h /tmp/wickra_embed.h
      - name: Build and run the C example (CMake + ctest)
        run: |
          cmake -S examples/c -B examples/c/build
          cmake --build examples/c/build --config Release
          ctest --test-dir examples/c/build -C Release --output-on-failure

  example-embedded:
    name: Embedded example (thumbv7em)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The example is its own workspace (so `cargo test --workspace` at the root
      # never pulls std onto the no_std core). Build from inside its directory so
      # its .cargo/config.toml applies — that file pins the thumbv7em target and
      # the cortex-m-rt linker script (-Tlink.x); a --manifest-path build from the
      # repo root would pick up neither. A QEMU run is optional and left to local
      # dev, since the runners have no qemu-system-arm.
      - name: Build the Cortex-M demo firmware
        run: cargo build --release
        working-directory: examples/embedded

  # The examples are what a reader copies. This runs the host example and
  # holds it to what it prints; the C sample runs under ctest in the c-abi
  # job and the Cortex-M one is cross-built in example-embedded.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: examples/host
      - name: Host example
        shell: bash
        run: |
          out=$(cargo run -q --manifest-path examples/host/Cargo.toml)
          echo "$out"
          echo "$out" | grep -q 'sma20'
          echo "$out" | grep -q 'ema20'

  # The repository's own consistency checks: one version everywhere, licence
  # texts inside every published package, package READMEs that link only to
  # what travels with them.
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10 # backstop against a wedged job, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree across every manifest
        run: python3 scripts/check_version_sync.py
      - name: Published packages carry their licence texts
        run: python3 scripts/check_license_copies.py
      - name: Package READMEs link only to what travels with them
        run: python3 scripts/check_readme_links.py

  # osv-scanner.toml exists in this repository and nothing ran it. The file
  # lists the advisories judged and accepted; this is what makes the judgement
  # enforceable rather than documentary.
  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20 # backstop against a wedged job, not a budget
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `--no-resolve`: everything pinned in a lockfile is scanned in full and
      # transitively, because a lockfile needs no resolution; the detached
      # example manifests carry a path dependency that cannot be resolved
      # from a registry.
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            --no-resolve
            --config=osv-scanner.toml
            ./

  # links.yml runs this on a schedule against the whole tree; this is the
  # pull-request half, so a README that gains a dead link is caught in review
  # rather than by a nightly nobody is watching. Non-blocking on purpose: an
  # external host being down is not this repository's defect -- and a release
  # PR's CHANGELOG links a tag that exists only after the merge.
  links:
    name: External links (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}" "*.md" "crates/embed-core/README.md"
          fail: true
